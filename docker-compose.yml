# Local stack: Postgres + Redis + migrations + backend + frontend (nginx).
#
#   cp private/support-bot.env.example private/support-bot.env
#   docker compose --env-file private/support-bot.env -p support-bot up -d --build
# If Docker cannot allocate its default network, use the tracked
# docker-compose.override.example.yml and create its documented network.
#
# The model service is configured in the UI (右上角「模型设置」): paste the
# OpenAI-compatible base URL, the API key, and pick a model from the fetched
# list. Nothing here needs a key, and no restart is required after saving.
#
# Host ports: 7100 (UI, LAN-reachable in the tracked local override) / 7101 (loopback API).
# Load test: see loadtest/README.md.
x-backend-env: &backend-env
  ENV: ${ENV:-dev}
  AUTH_MODE: ${AUTH_MODE:-dev}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in private/support-bot.env}
  # Bootstrap defaults for the model service; the settings page overrides them.
  MODEL_BASE_URL: ${MODEL_BASE_URL:-}
  MODEL_API_KEY: ${MODEL_API_KEY:-}
  MODEL_NAME: ${MODEL_NAME:-}
  # Encrypts the stored API key at rest (dev default when empty).
  CONFIG_SECRET_KEY: ${CONFIG_SECRET_KEY:?set CONFIG_SECRET_KEY in private/support-bot.env}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in private/support-bot.env}
  REDIS_URL: redis://redis:6379/0
  MAX_CONCURRENT_TURNS: ${MAX_CONCURRENT_TURNS:-200}
  CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-10/minute}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OPIK_URL_OVERRIDE: ${OPIK_URL_OVERRIDE:-}
  OPIK_API_KEY: ${OPIK_API_KEY:-}
  OPIK_WORKSPACE: ${OPIK_WORKSPACE:-}
  OPIK_PROJECT_NAME: ${OPIK_PROJECT_NAME:-support-bot}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in private/support-bot.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in private/support-bot.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in private/support-bot.env}
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations and load the demo fixture.
  migrate:
    build: ./backend
    # Share one image with `backend`, so a rebuild can never leave the
    # migration step running stale code (it used to get its own image copy).
    image: support-bot-backend:latest
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: support-bot-backend:latest
    environment: *backend-env
    # Reach a self-hosted Opik on the host (Linux needs the explicit mapping).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:7101:8000"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:7100:8080"

  # --- load testing (docker compose --profile loadtest ...) -----------------
  seed-synthetic:
    profiles: ["loadtest"]
    build: ./backend
    environment: *backend-env
    command: ["python", "-m", "scripts.seed_synthetic", "--customers", "${LT_CUSTOMERS:-10000}", "--reset"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  locust-master:
    profiles: ["loadtest"]
    build: ./loadtest
    command: >
      -f locustfile.py --master --host http://frontend:8080
      ${LOCUST_ARGS:-}
    environment:
      LOAD_SHAPE: ${LOAD_SHAPE:-}
      LT_SCALE: ${LT_SCALE:-1}
      LT_CUSTOMERS: ${LT_CUSTOMERS:-10000}
      LT_WORKERS: ${LT_WORKERS:-4}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in private/support-bot.env}
      # for `docker compose run --entrypoint python locust-master check_invariants.py`
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in private/support-bot.env}
    ports:
      - "127.0.0.1:8089:8089"
    volumes:
      - ./loadtest/results:/loadtest/results
    depends_on:
      seed-synthetic:
        condition: service_completed_successfully
      frontend:
        condition: service_started

  locust-worker:
    profiles: ["loadtest"]
    build: ./loadtest
    command: ["-f", "locustfile.py", "--worker", "--master-host", "locust-master"]
    environment:
      LOAD_SHAPE: ${LOAD_SHAPE:-}
      LT_SCALE: ${LT_SCALE:-1}
      LT_CUSTOMERS: ${LT_CUSTOMERS:-10000}
      LT_WORKERS: ${LT_WORKERS:-4}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in private/support-bot.env}
    depends_on:
      - locust-master

volumes:
  pg_data:
